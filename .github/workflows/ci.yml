name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gnome-shell gir1.2-adw-1 xvfb xauth dbus-x11 unzip
      - name: Test logic, preferences, and extension ZIP
        run: dbus-run-session -- xvfb-run -a make check

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gnome-shell gir1.2-adw-1 xvfb xauth dbus-x11 unzip
      - name: Test logic, preferences, and extension ZIP
        run: dbus-run-session -- xvfb-run -a make check
